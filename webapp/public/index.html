<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <title>IoT Dashboard</title>

    <link rel="icon" href="img/LOGO.svg" />
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
<header class="topbar">
    <h1>IoT Dashboard</h1>

    <div class="topbar-right">
        <div id="userInfo" class="user-info"></div>

        <button id="logoutBtn" class="logout-btn">Logout</button>

        <div class="darkmode-wrapper">
            <span class="darkmode-label">Dark Mode</span>
            <label class="switch">
                <input type="checkbox" id="themeToggle">
                <span class="slider"></span>
            </label>
        </div>
    </div>
</header>

<main class="container">
    <section class="card controls">
        <h2>Zeitraum wählen</h2>

        <div class="input-row horizontal">
            <label>
                Von:
                <input type="datetime-local" id="from">
            </label>

            <label>
                Bis:
                <input type="datetime-local" id="to">
            </label>

            <button id="loadDataBtn">Daten laden</button>
            <button id="exportBtn">Export Data</button>
        </div>
    </section>

    <section class="card chart-card">
        <div class="chart-header">
            <h2>Sensordaten</h2>

            <div id="rangeButtons" class="range-buttons">
                <button class="range-btn" data-range="1">1 Stunde</button>
                <button class="range-btn" data-range="10">10 Stunden</button>
                <button class="range-btn" data-range="24">24 Stunden</button>
            </div>
        </div>

        <div id="chartStatus"></div>
        <canvas id="sensorChart"></canvas>
    </section>
</main>

<script src="external/keycloak.js"></script>
<script src="external/chart.umd.js"></script>

<script type="module" src="js/frontend/main.js"></script>
</body>
</html>
