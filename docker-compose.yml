services:
  webapp:
    build: webapp
    container_name: backend
    restart: always
    env_file: environment/webapp.env
    volumes:
      - ./nginx/certs/ca.crt:/usr/src/app/certs/ca.crt:ro
      - ./nginx/certs/www_cert.cert:/usr/src/app/certs/server.crt:ro
      - ./nginx/certs/www_key.key:/usr/src/app/certs/server.key:ro
    depends_on:
      db:
        condition: service_healthy
      keycloak_web:
        condition: service_healthy
    networks:
      - app-network


  db:
    image: mariadb:latest
    command: --event-scheduler=ON
    container_name: mariadb
    restart: always
    env_file: environment/db.env
    volumes:
      - mariadb-data:/var/lib/mysql
      - /mariadb/conf.d:/etc/mysql/conf.d:ro
      - ./mariadb:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      app-network:
        aliases:
          - maria

  mqtt:
    image: eclipse-mosquitto:latest
    container_name: mqtt
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:rw
      - ./mosquitto/data:/mosquitto/data:rw
      - ./mosquitto/log:/mosquitto/log:rw
      - ./mosquitto/secure:/mosquitto/secure:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    networks:
      sensor-network:
        aliases:
          - mqtt.local

  nginx:
    image: owasp/modsecurity-crs:nginx
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    env_file: environment/nginx.env
    volumes:
      - ./nginx/certs/www_key.key:/etc/nginx/certs/www_key.key:ro
      - ./nginx/certs/www_cert.cert:/etc/nginx/certs/www_cert.cert:ro
      - ./nginx/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
    depends_on:
      - webapp
    networks:
      app-network:

  keycloak_web:
    image: quay.io/keycloak/keycloak:23.0.7
    container_name: keycloak_web
    env_file: environment/keycloak.env
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/iot-realm.json:/opt/keycloak/data/import/iot-realm.json:ro
      - ./nginx/certs/www_cert.cert:/opt/keycloak/certs/www_cert.cert:ro
      - ./nginx/certs/www_key.key:/opt/keycloak/certs/www_key.key:ro 
    command: >
      start  --import-realm
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /auth/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep '200 OK' || exit 1" ]
      interval: 10s
      timeout: 9s
      retries: 30
      start_period: 40s
    networks:
      - app-network

  controller:
    build: controller/
    restart: unless-stopped
    env_file: environment/controller.env
    volumes:
      - ./nginx/certs/ca.crt:/ca.crt:ro
    depends_on:
      - mqtt
      - nginx
    extra_hosts:
      - "www.lab.local:192.168.4.18"
    networks:
      sensor-network:

networks:
  app-network:
    driver: bridge
  sensor-network:
    driver: bridge

volumes:
  mariadb-data:
  keycloak_data: