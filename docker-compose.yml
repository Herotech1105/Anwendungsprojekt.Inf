services:
  app:
    build: .
    container_name: backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=myapp
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: mariadb:latest
    command: --event-scheduler=ON
    container_name: mariadb
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=root_password
      - MARIADB_DATABASE=myapp
      - MARIADB_USER=user
      - MARIADB_PASSWORD=password
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./MariaDB:/docker-entrypoint-initdb.d
    networks:
      - app-network

  mqtt:
    image: eclipse-mosquitto:latest
    container_name: mqtt
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:rw
      - ./mosquitto/data:/mosquitto/data:rw
      - ./mosquitto/log:/mosquitto/log:rw
      - ./mosquitto/secure:/mosquitto/secure:ro
      - /etc/timezone:/etc/timezone:ro
      - /set/localtime:/etc/localtime:ro
    restart: unless-stopped
    networks:
      sensor-network:
        aliases:
          - mqtt.local
      app-network:
        aliases:
          - mqtt.local
      
networks:
  app-network:
    driver: bridge
  sensor-network:
    driver: bridge

volumes:
  mariadb-data:
