services:
  webapp:
    build: .
    container_name: backend
    restart: always
    environment:
      - DB_HOST=mariadb
      - DB_USER=db_write_user
      - DB_PASSWORD=password
      - DB_NAME=myapp
      - PORT=3000
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: mariadb:latest
    command: --event-scheduler=ON
    container_name: mariadb
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=root_password
      - MARIADB_DATABASE=myapp
      - MARIADB_USER=user
      - MARIADB_PASSWORD=password
    volumes:
      - /mariadb/db:/var/lib/mysql
      - /mariadb/conf.d:/etc/mysql/conf.d:ro
      - /mariadb/01_config.sql:/docker-entrypoint-initdb.d/01_config.sql:ro
    networks:
      app-network:
        aliases:
          - maria

  mqtt:
    image: eclipse-mosquitto:latest
    container_name: mqtt
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:rw
      - ./mosquitto/data:/mosquitto/data:rw
      - ./mosquitto/log:/mosquitto/log:rw
      - ./mosquitto/secure:/mosquitto/secure:ro
      - /etc/timezone:/etc/timezone:ro
      - /set/localtime:/etc/localtime:ro
    restart: unless-stopped
    networks:
      sensor-network:
        aliases:
          - mqtt.local

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/certs/www_key.key:/etc/nginx/certs/www_key.key:ro
      - ./nginx/certs/www_cert.cert:/etc/nginx/certs/www_cert.cert:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      app-network:
    depends_on:
      - webapp

networks:
  app-network:
    driver: bridge
  sensor-network:
    driver: bridge

volumes:
  mariadb-data:
