services:
  webapp:
    build: .
    container_name: backend
    restart: always
    environment:
      - DB_HOST=mariadb
      - DB_USER=websrv_write
      - DB_PASSWORD=pass-0123-iot
      - DB_NAME=myapp
      - PORT=3000
      - API_KEY=api_key
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: mariadb:latest
    command: --event-scheduler=ON
    container_name: mariadb
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=root_password
      - MARIADB_DATABASE=myapp
      - MARIADB_USER=user
      - MARIADB_PASSWORD=password
    volumes:
      - /mariadb/db:/var/lib/mysql
      - /mariadb/conf.d:/etc/mysql/conf.d:ro
      - /mariadb/01_config.sql:/docker-entrypoint-initdb.d/01_config.sql:ro#
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      app-network:
        aliases:
          - maria

  mqtt:
    image: eclipse-mosquitto:latest
    container_name: mqtt
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:rw
      - ./mosquitto/data:/mosquitto/data:rw
      - ./mosquitto/log:/mosquitto/log:rw
      - ./mosquitto/secure:/mosquitto/secure:ro
      - /etc/timezone:/etc/timezone:ro
      - /set/localtime:/etc/localtime:ro
    restart: unless-stopped
    networks:
      sensor-network:
        aliases:
          - mqtt.local

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/certs/www_key.key:/etc/nginx/certs/www_key.key:ro
      - ./nginx/certs/www_cert.cert:/etc/nginx/certs/www_cert.cert:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/modsecurity.conf:/etc/nginx/modsec/modsecurity.conf:ro
    networks:
      app-network:
    depends_on:
      - webapp

  controller:
    build: sensor-net/
    restart: unless-stopped
    volumes:
      - ./sensor-data/ca.crt:/ca.crt
    depends_on:
      - mqtt
      - webapp
    extra_hosts:
      - "www.lab.local:host-gateway"
    networks:
      sensor-network:

networks:
  app-network:
    driver: bridge
  sensor-network:
    driver: bridge

volumes:
  mariadb-data:
