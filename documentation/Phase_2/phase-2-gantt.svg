<svg width="1100" height="380" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header { font: bold 12px Arial, sans-serif; fill: cyan; }
    .task { font: 13px Arial, sans-serif; fill: cyan; }
    .grid { stroke: #ddd; stroke-width: 1; }
    .bar { fill: #4f8ef7; rx: 4; ry: 4; }
    .bar2 { fill: #2ecc71; rx: 4; ry: 4; }
    .dep { stroke: #666; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666"></path>
    </marker>
  </defs>

  <!-- Zeitachse -->
  <g transform="translate(250,60)">
    <text x="15" y="0" class="header">16 Apr</text>
    <text x="75" y="0" class="header">17 Apr</text>
    <text x="135" y="0" class="header">18 Apr</text>
    <text x="195" y="0" class="header">19 Apr</text>
    <text x="255" y="0" class="header">20 Apr</text>
    <text x="315" y="0" class="header">21 Apr</text>
    <text x="375" y="0" class="header">22 Apr</text>
    <text x="435" y="0" class="header">23 Apr</text>
    <text x="495" y="0" class="header">24 Apr</text>
    <text x="555" y="0" class="header">25 Apr</text>

    <!-- Vertikale Rasterlinien -->
    <g class="grid">
      <line x1="0" y1="10" x2="0" y2="280"></line>
      <line x1="60" y1="10" x2="60" y2="280"></line>
      <line x1="120" y1="10" x2="120" y2="280"></line>
      <line x1="180" y1="10" x2="180" y2="280"></line>
      <line x1="240" y1="10" x2="240" y2="280"></line>
      <line x1="300" y1="10" x2="300" y2="280"></line>
      <line x1="360" y1="10" x2="360" y2="280"></line>
      <line x1="420" y1="10" x2="420" y2="280"></line>
      <line x1="480" y1="10" x2="480" y2="280"></line>
      <line x1="540" y1="10" x2="540" y2="280"></line>
      <line x1="600" y1="10" x2="600" y2="280"></line>
    </g>
  </g>

  <!-- Aufgaben -->
  <g transform="translate(20,80)">
    <text x="0" y="20" class="task">Update Deployment Diagram</text>
    <rect x="250" y="5" width="180" height="24" class="bar"></rect>

    <text x="0" y="60" class="task">Evaluate Security Principles</text>
    <rect x="430" y="45" width="120" height="24" class="bar2"></rect>

    <text x="0" y="100" class="task">Install OS on Pi's</text>
    <rect x="250" y="85" width="180" height="24" class="bar"></rect>

    <text x="0" y="140" class="task">Setup Access Point</text>
    <rect x="430" y="125" width="240" height="24" class="bar2"></rect>

    <text x="0" y="180" class="task">Configure Firewall</text>
    <rect x="670" y="165" width="180" height="24" class="bar"></rect>

    <text x="0" y="220" class="task">Integrate Backend</text>
    <rect x="670" y="205" width="180" height="24" class="bar"></rect>

    <text x="0" y="260" class="task">Integrate Microcontroller</text>
    <rect x="670" y="245" width="180" height="24" class="bar"></rect>

    <!-- Abhängigkeiten -->
    <path d="M430 17 L430 57" class="dep"></path>
    <path d="M430 97 L430 137" class="dep"></path>
    <path d="M670 137 L670 177" class="dep"></path>
    <path d="M670 137 L670 217" class="dep"></path>
    <path d="M670 137 L670 257" class="dep"></path>
  </g>
</svg>
